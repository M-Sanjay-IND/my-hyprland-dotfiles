source = /home/kernel_x23_6/.config/hypr/theme.conf

# --- Layer rules: blur + ignore-zero per overlay rofi ---
# Senza queste, l'opacità 0xd9 di rofi mostra il wallpaper opaco
# invece del blur Hyprland coerente con le finestre.
# NB: in Hyprland 0.54+ la keyword è `layer_rule` (con underscore),
#     non `layerrule` come nelle versioni precedenti.
layer_rule = blur, rofi
layer_rule = ignorezero, rofi

layer_rule = blur, swaync-control-center
layer_rule = ignorezero, swaync-control-center
layer_rule = blur, swaync-notification-window
layer_rule = ignorezero, swaync-notification-window
layer_rule = blur, wlogout
layer_rule = ignorezero, wlogout
