# --- Sopprime maximize automatico ---
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# --- Fix XWayland drag ---
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# --- hyprland-run ---
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

# --- Burp Suite ---
windowrule {
    name = burpsuite-main
    match:class = ^(burp-StartBurp)$
    no_max_size = on
    min_size = 600 400
}

windowrule {
    name = burpsuite-dialogs-modal
    match:class = ^(burp-StartBurp)$
    match:modal = true
    float = on
    center = on
    size = 1100 760
}

windowrule {
    name = burpsuite-dialogs-title
    match:class = ^(burp-StartBurp)$
    match:title = ^(.*Settings.*|.*Preferences.*|.*Options.*|.*Dialog.*)$
    float = on
    center = on
    size = 1100 760
}

# --- Spotify: float di default, dimensione comoda, centrata ---
windowrule {
    name = spotify-float
    match:class = ^(Spotify)$
    float = on
    size = 1100 720
    center = on
}

# --- NetworkManager connection editor ---
windowrule {
    name = nm-connection-editor-popup
    match:class = ^(nm-connection-editor|Nm-connection-editor)$
    float = on
    center = on
    size = 920 640
}

# --- Floating terminal tools ---
windowrule {
    name = floating-terminal-tools
    match:class = ^(floating-tool)$
    float = on
    center = on
    size = 900 620
}

# --- Keybind cheat sheet ---
windowrule {
    name = keybind-help
    match:class = ^(keybind-help)$
    float = on
    center = on
    size = 880 840
    pin = on
}
