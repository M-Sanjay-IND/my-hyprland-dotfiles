$mainMod = SUPER

# --- App launch ---
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, firefox -P pentest --no-remote
bind = $mainMod, O, exec, $notes
bind = $mainMod, V, exec, $editor
bind = $mainMod ALT, V, exec, $editor-alt
bind = $mainMod, F, exec, $terminal $fileManager
bind = $mainMod, A, exec, $menu
bind = $mainMod, P, exec, $colorPicker | wl-copy
bind = $mainMod SHIFT, P, exec, ~/.config/waybar/scripts/idle-toggle.sh
bind = $mainMod SHIFT, A, exec, /home/kernel_x23_6/.local/bin/rofi-launcher -show emoji

# --- Wallpaper picker (SUPER+SHIFT+W) --- #
bind = $mainMod SHIFT, W, exec, /home/kernel_x23_6/.local/bin/rofi-wallpaper

# --- Window management ---
bind = $mainMod, Q, killactive
# Float preset: minimize (1100x720, centered) / maximize (1800x980, centered)
bind = $mainMod, M, resizeactive, exact 1100 720
bind = $mainMod, M, centerwindow
bind = $mainMod SHIFT, M, resizeactive, exact 1500 820
bind = $mainMod SHIFT, M, centerwindow
bind = $mainMod, W, togglefloating
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod SHIFT, F, fullscreen, 0          # fullscreen vero (nasconde waybar)
bind = $mainMod ALT, F, fullscreen, 1            # fake fullscreen (mantiene gaps/waybar)
bind = $mainMod, SPACE, centerwindow             # centra finestra floating

# --- Alt-Tab ---
bind = ALT, Tab, cyclenext, prev
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext
bind = ALT SHIFT, Tab, bringactivetotop

# --- Focus con frecce ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Vim Style ---
#bind = $mainMod, H, movefocus, l
#bind = $mainMod, L, movefocus, r
#bind = $mainMod, K, movefocus, u
#bind = $mainMod, J, movefocus, d


# --- Sposta finestra nel layout ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Vim Style ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d


# --- Resize con CTRL + frecce ---
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30

# --- Vim Style ---
binde = $mainMod CTRL, L, resizeactive, 30 0
binde = $mainMod CTRL, H, resizeactive, -30 0
binde = $mainMod CTRL, K, resizeactive, 0 -30
binde = $mainMod CTRL, J, resizeactive, 0 30

# --- Move/resize con mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# --- Workspace: switch ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Workspace: sposta finestra E segui ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Workspace: sposta finestra senza seguire (rimani qui) ---
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# --- Scratchpad ---
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Workspace: ciclo con SUPER+TAB ---
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, previous

# --- Scroll workspace con mouse ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# --- Clipboard ---
#bind = SUPER, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist decode | wl-copy

# --- Lock / logout ---
bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, wlogout -p layer-shell -C /home/kernel_x23_6/.config/wlogout/style.css -l /home/kernel_x23_6/.config/wlogout/layout -b 5

# --- Waybar toggle ---
bind = Ctrl, Escape, exec, killall waybar || waybar

# --- Screenshot ---
bind = , Print, exec, grimblast --notify copysave screen
bind = SUPER, Print, exec, grimblast --notify copysave active
bind = SUPER ALT, Print, exec, grimblast --notify copysave area
bind = SUPER SHIFT, Print, exec, grimblast save area /tmp/swappy-screenshot.png && swappy -f /tmp/swappy-screenshot.png

# --- Volume ---
bind = , XF86AudioRaiseVolume, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-volume up
bind = , XF86AudioLowerVolume, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-volume down
bind = , XF86AudioMicMute, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-volume mic
bind = , XF86AudioMute, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-volume mute
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# --- Brightness ---
bind = , XF86MonBrightnessUp, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-brightness up
bind = , XF86MonBrightnessDown, exec, /home/kernel_x23_6/.config/hypr/scripts/osd-brightness down

# --- Notification center ---
bind = $mainMod, N, exec, swaync-client -t

# --- Info / cheatsheet + tema switch ---
bind = $mainMod, I, exec, kitty --class keybind-help --override font_size=10 -e /home/kernel_x23_6/.config/hypr/scripts/keybind-help.sh
bind = $mainMod SHIFT, I, exec, /home/kernel_x23_6/.config/waybar/scripts/theme-switch.sh matrix
bind = $mainMod CTRL, I, exec, /home/kernel_x23_6/.config/waybar/scripts/theme-switch.sh macchiato
