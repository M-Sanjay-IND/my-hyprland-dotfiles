general {
    gaps_in = 3
    gaps_out = 6

    border_size = 2

    # Matrix / BlackArch Red: hot red edge with ember accent.
    col.active_border = rgba(ff4455ff) rgba(ff8040ff) 45deg
    col.inactive_border = rgba(1e0606cc)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 1

    active_opacity = 1.0
    inactive_opacity = 0.82

    blur {
        enabled = true 
        size = 5
        passes = 2
        new_optimizations = true
        vibrancy = 0.09
        ignore_opacity = false
        xray = true
    }
}

animations {
    enabled = true

    bezier = wind, 0.08, 0.86, 0.12, 1.0
    bezier = winIn, 0.12, 0.98, 0.12, 1.0
    bezier = winOut, 0.22, 0.0, 0.0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 5, wind, slide
    animation = windowsIn, 1, 5, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = windowsMove, 1, 4, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 24, liner, loop
    animation = fade, 1, 8, default
    animation = workspaces, 1, 4, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    size_limits_tiled = true
}
