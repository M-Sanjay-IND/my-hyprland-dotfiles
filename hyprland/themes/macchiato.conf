general {
    gaps_in = 2
    gaps_out = 5

    border_size = 2

    # Matrix green — swap: decommentare + commentare il blocco Macchiato sotto
    # col.active_border = rgba(00ff00ff) rgba(008800ff) 45deg
    # col.inactive_border = rgba(003300aa)

    # Catppuccin Macchiato: lavender → blue gradient
    col.active_border = rgba(b7bdf8ff) rgba(8aadf4ff) 45deg
    col.inactive_border = rgba(363a4faa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 5

    active_opacity = 1.0
    inactive_opacity = 0.75

    blur {
        enabled = true 
        size = 6
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = false
        xray = true
    }
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    size_limits_tiled = true
}
