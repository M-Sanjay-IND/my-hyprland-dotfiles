# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  HYPRLAND MASTER CONFIGURATION — 100% ROCK SOLID C++ DISPATCHERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Monitors ─────────────────────────────────────────────────────────────────
monitor = eDP-1, preferred, auto, 1.25
monitor = DP-1, preferred, auto-right, 1
monitor = , preferred, auto, auto

# ── My Programs ──────────────────────────────────────────────────────────────
$terminal = kitty
$fileManager = kitty yazi
$menu = /home/sanjaym/.local/bin/rofi-launcher -show drun -modi 'drun,window,clipboard:/home/sanjaym/.local/bin/rofi-clipboard'
$browser = firefox
$notes = obsidian
$editor = code
$colorPicker = hyprpicker

# ── Environment Variables ────────────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = MOZ_ENABLE_WAYLAND, 1
env = LIBVA_DRIVER_NAME, nvidia
env = XDG_SESSION_TYPE, wayland
env = GBM_BACKEND, nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = NVD_BACKEND, direct
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_STYLE_OVERRIDE, kvantum
env = GDK_BACKEND, wayland,x11,*
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland

# ── Autostart ────────────────────────────────────────────────────────────────
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = swaync
exec-once = waybar
exec-once = awww-daemon
exec-once = /home/sanjaym/.local/bin/rofi-wallpaper --random
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# ── General Layout & Appearance ──────────────────────────────────────────────
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(b7bdf8ff) rgba(8aadf4ff) 45deg
    col.inactive_border = rgba(363a4faa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 0.75

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.1696
        ignore_opacity = false
        xray = true
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0.0, 1.0
    bezier = liner, 1.0, 1.0, 1.0, 1.0

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    size_limits_tiled = true
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  KEYBINDINGS — NATIVE HYPRLAND C++ (NO LUA CRASHES)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$mainMod = SUPER

# App launches
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, A, exec, $menu
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, firefox -P pentest --no-remote
bind = $mainMod, O, exec, $notes
bind = $mainMod, V, exec, $editor
bind = $mainMod ALT, V, exec, subl
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, P, exec, sh -c '$colorPicker | wl-copy'
bind = $mainMod SHIFT, P, exec, /home/sanjaym/.config/waybar/scripts/idle-toggle.sh
bind = $mainMod SHIFT, A, exec, /home/sanjaym/.local/bin/rofi-launcher -show emoji
bind = $mainMod SHIFT, W, exec, /home/sanjaym/.local/bin/rofi-wallpaper

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod, W, togglefloating,
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod ALT, F, fullscreen, 1
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, C, centerwindow,

# Focus navigation (Arrows & Vim)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows (Repeating)
binde = $mainMod CTRL, right, resizeactive, 30 0
binde = $mainMod CTRL, left, resizeactive, -30 0
binde = $mainMod CTRL, up, resizeactive, 0 -30
binde = $mainMod CTRL, down, resizeactive, 0 30
binde = $mainMod CTRL, L, resizeactive, 30 0
binde = $mainMod CTRL, H, resizeactive, -30 0
binde = $mainMod CTRL, K, resizeactive, 0 -30
binde = $mainMod CTRL, J, resizeactive, 0 30

# Mouse drag / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Alt-Tab window cycle
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Workspace Switching (SUPER + 1-0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Window to Workspace (SUPER + SHIFT + 1-0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move Window Silently (SUPER + CTRL + 1-0)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Special Workspace / Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Cycle Workspaces (SUPER + TAB / Mouse wheel)
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Lock / Logout / Waybar
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, ESCAPE, exec, wlogout -p layer-shell -C /home/sanjaym/.config/wlogout/style.css -l /home/sanjaym/.config/wlogout/layout -b 5
bind = CTRL, ESCAPE, exec, sh -c 'killall waybar || waybar'

# Screenshots
bind = , Print, exec, grimblast --notify copysave screen
bind = $mainMod, Print, exec, grimblast --notify copysave active
bind = $mainMod ALT, Print, exec, grimblast --notify copysave area
bind = $mainMod SHIFT, Print, exec, sh -c 'grimblast save area /tmp/swappy-screenshot.png && swappy -f /tmp/swappy-screenshot.png'

# Hardware Volume & Brightness Keys
bindl = , XF86AudioRaiseVolume, exec, /home/sanjaym/.config/hypr/scripts/osd-volume up
bindl = , XF86AudioLowerVolume, exec, /home/sanjaym/.config/hypr/scripts/osd-volume down
bindl = , XF86AudioMicMute, exec, /home/sanjaym/.config/hypr/scripts/osd-volume mic
bindl = , XF86AudioMute, exec, /home/sanjaym/.config/hypr/scripts/osd-volume mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, /home/sanjaym/.config/hypr/scripts/osd-brightness up
bindl = , XF86MonBrightnessDown, exec, /home/sanjaym/.config/hypr/scripts/osd-brightness down

# Notifications & Cheatsheet
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, I, exec, kitty --class keybind-help --override font_size=10 -e /home/sanjaym/.config/hypr/scripts/keybind-help.sh
bind = $mainMod SHIFT, I, exec, /home/sanjaym/.config/waybar/scripts/theme-switch.sh matrix
bind = $mainMod CTRL, I, exec, /home/sanjaym/.config/waybar/scripts/theme-switch.sh macchiato
